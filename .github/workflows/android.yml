name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      INTEGRATION_MODE: mock
      ALLOW_BILLABLE_REQUESTS: "false"
      SIMULATION_ENABLED: "true"
      SIMULATION_SCENARIO_SEED: ci
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject production secrets
        working-directory: .
        shell: pwsh
        run: ./.github/scripts/check-secrets.ps1

      - name: Configure JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint and assemble
        run: ./gradlew test lintDebug assembleDebug
